name: Keep fetch workflow enabled

# GitHub disables scheduled workflows in a public repository after 60 days without repository activity.
# Once a month this re-enables fetch.yml (and itself) with the gh CLI. No third-party action is used.

on:
  schedule:
    - cron: '41 5 1 * *' # monthly
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the scheduled workflows
        run: |
          gh workflow enable fetch.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
